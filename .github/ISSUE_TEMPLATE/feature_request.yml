name: Feature request
description: Suggest a capability or improvement for the starter.
title: "feat: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        This is a **starter template**, so the bar for new features is whether most
        projects built on it would want the thing. Highly app-specific features are
        usually better left to the project that clones this repo.

        New patterns are not free: `.claude/rules/` is a contract, and anything that
        introduces a pattern has to update the matching rule file in the same change.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you hit, not the solution you have in mind.
      placeholder: |
        Every project I start from this template has to hand-roll file uploads to S3,
        because there is no storage abstraction in libs/ at all.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        What would you add or change, and which layer does it belong in?
        Shared infrastructure goes in `src/libs/` behind a path alias; feature code goes in
        `src/modules/<feature>/` as `index.ts` + `schema.ts` + `service.ts`.
      placeholder: |
        A `StorageService` under `src/libs/storage/` (alias `@storage`) with a local driver
        and an S3 driver, selected by a STORAGE_DRIVER env var validated in `@config`
        and registered in the DI container in `src/bootstrap.ts`.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area would this touch?
      multiple: true
      options:
        - Auth / tokens
        - RBAC (RoleGuard, PermissionGuard, AuthPlugin)
        - Database / Prisma / migrations
        - ClickHouse (analytics)
        - Validation / TypeBox schemas
        - i18n / locale catalogs (en, id)
        - Response envelope (ResponseToolkit) / error handling
        - OpenAPI / Scalar reference at /docs
        - Caching / Redis
        - Queues / mail (BullMQ, Nodemailer)
        - Rate limiting / security headers / CORS
        - Cluster mode (APP_CLUSTER_MODE, APP_CLUSTER_WORKERS)
        - Plugins / DI container
        - Build / tooling / CI
        - Docker / deployment
        - Documentation
        - New shared lib under src/libs/
        - New feature module under src/modules/
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do nothing and let each project solve it" — say why that is not enough.

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: This would be a breaking change for existing projects built on the template.
        - label: This adds a new dependency.
        - label: This needs a new or updated rule file in `.claude/rules/`.
        - label: This behaves differently under cluster mode (`APP_CLUSTER_MODE=true`).
        - label: I am willing to open a pull request for this.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: I read the relevant rule in `.claude/rules/` and my proposal fits it (or says why it should change).
          required: true
