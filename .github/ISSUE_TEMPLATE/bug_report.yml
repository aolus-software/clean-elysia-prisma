name: Bug report
description: Something in the starter behaves incorrectly or crashes.
title: "bug: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please fill in what you can —
        a reproduction is worth more than a long description.

        **Do not report security vulnerabilities here.** See [SECURITY.md](../blob/main/.github/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
      placeholder: |
        POST /auth/login with a wrong password returns 500 instead of the 401
        envelope that ErrorHandlerPlugin should produce.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it. Include the request and response if it is an HTTP issue.
      placeholder: |
        1. bun install
        2. docker compose up -d
        3. make db-migrate-dev && make db-seed
        4. bun run dev
        5. curl -X POST localhost:3000/auth/login -H 'Content-Type: application/json' -d '{"email":"a@b.c","password":"wrong"}'
        6. Observe 500
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: |
        Paste the pino output or the response body. If you have the `x-request-id`
        of the failing request, include it. This is rendered as code, no backticks needed.
      render: shell

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      multiple: true
      options:
        - Auth / tokens (login, register, verify email, forgot / reset password)
        - RBAC (RoleGuard, PermissionGuard, AuthPlugin)
        - Database / Prisma / migrations
        - ClickHouse (analytics)
        - Validation / TypeBox schemas
        - i18n / locale catalogs (en, id)
        - Response envelope (ResponseToolkit) / error handling
        - OpenAPI / Scalar reference at /docs
        - Caching / Redis
        - Queues / mail (BullMQ, Nodemailer)
        - Rate limiting / security headers / CORS
        - Cluster mode (APP_CLUSTER_MODE, APP_CLUSTER_WORKERS)
        - Plugins / DI container
        - Build / tooling / CI
        - Docker / deployment
        - Documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: "Output of `git rev-parse --short HEAD`, or the `version` field in package.json"
      placeholder: d53ea77
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run these and paste the output:
        `bun --version`, `bunx --bun prisma --version`, and your OS.
        Also say whether `APP_CLUSTER_MODE` was on — cluster mode changes how workers,
        queues, and in-memory state behave.
      placeholder: |
        Bun: 1.3.x
        Prisma: 7.8.0
        OS: macOS 15 / Ubuntu 24.04
        Postgres: 18.1 (docker-compose)
        Redis: 7 (docker-compose)
        ClickHouse: 23.12 (docker-compose, only if relevant)
        APP_CLUSTER_MODE: false
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am running the Postgres and Redis versions from `docker-compose.yml`.
          required: true
        - label: I ran `bun install`, `make db-generate`, and applied migrations before reproducing.
          required: true
